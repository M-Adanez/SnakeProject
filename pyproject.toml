[project]
name = "snakeproject"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "opencv-python>=5.0.0.93",
    "optuna>=5.0.0",
    "scipy>=1.18.1",
    "stable-baselines3[extra]>=2.9.2",
    "tensorboard>=2.21.0",
    "torch==2.14.1+cu126; sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
